[package]
name = "folyvo-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "folyvo"
path = "src/main.rs"

[dependencies]
folyvo-core = { path = "../folyvo-core", version = "0.1.0" }
dirs = "7"
jiff = { version = "1.0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }

[dev-dependencies]
tempfile = "3"
