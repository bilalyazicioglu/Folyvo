[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is pulled in by Tauri's Linux GTK backend, which Folyvo never builds (macOS only). It is unmaintained, not vulnerable." },
  { id = "RUSTSEC-2026-0370", reason = "zvariant comes with zbus, which the notification plugin uses only on Linux; Folyvo never builds for Linux. Unmaintained, not vulnerable." },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive comes with zbus, which the notification plugin uses only on Linux; Folyvo never builds for Linux. Unmaintained, not vulnerable." },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names comes with zbus, which the notification plugin uses only on Linux; Folyvo never builds for Linux. Unmaintained, not vulnerable." },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "GPL-3.0-or-later",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
