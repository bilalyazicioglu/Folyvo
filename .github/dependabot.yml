version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
# The cargo and npm entries are added together with the code they update.
