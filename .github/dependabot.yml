version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
  - package-ecosystem: npm
    directory: /apps/desktop/ui
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
