name: Install actionlint
description: Download a pinned actionlint release and verify its checksum
inputs:
  version:
    description: actionlint version without the leading v
    default: "1.7.7"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        base="https://github.com/rhysd/actionlint/releases/download/v${VERSION}"
        curl -fsSL -O "${base}/actionlint_${VERSION}_linux_amd64.tar.gz"
        curl -fsSL -O "${base}/actionlint_${VERSION}_checksums.txt"
        grep " actionlint_${VERSION}_linux_amd64.tar.gz\$" actionlint_${VERSION}_checksums.txt | sha256sum -c -
        tar -xzf actionlint_${VERSION}_linux_amd64.tar.gz actionlint
