name: Install gitleaks
description: Download a pinned gitleaks release and verify its checksum
inputs:
  version:
    description: gitleaks version without the leading v
    default: "8.21.2"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
        curl -fsSL -O "${base}/gitleaks_${VERSION}_linux_x64.tar.gz"
        curl -fsSL -O "${base}/gitleaks_${VERSION}_checksums.txt"
        grep " gitleaks_${VERSION}_linux_x64.tar.gz\$" gitleaks_${VERSION}_checksums.txt | sha256sum -c -
        tar -xzf gitleaks_${VERSION}_linux_x64.tar.gz gitleaks
