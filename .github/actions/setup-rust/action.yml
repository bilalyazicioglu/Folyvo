name: Set up Rust
description: Install the stable Rust toolchain and restore the build cache
inputs:
  components:
    description: Extra toolchain components, comma separated
    default: ""
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: ${{ inputs.components }}
    - uses: Swatinem/rust-cache@v2
