name: Set up Rust
description: Install the stable Rust toolchain and restore the build cache
inputs:
  components:
    description: Extra toolchain components, comma separated
    default: ""
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: stable
        components: ${{ inputs.components }}
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
