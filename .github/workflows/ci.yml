name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check commit messages
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-commits.sh "origin/${BASE_REF}..${HEAD_SHA}"

  fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: detect
        run: |
          if [ -f Cargo.toml ]; then echo "rust=true" >> "$GITHUB_OUTPUT"; else echo "rust=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.detect.outputs.rust == 'true'
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      - if: steps.detect.outputs.rust == 'true'
        run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: detect
        run: |
          if [ -f Cargo.toml ]; then echo "rust=true" >> "$GITHUB_OUTPUT"; else echo "rust=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.detect.outputs.rust == 'true'
        uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - if: steps.detect.outputs.rust == 'true'
        run: cargo clippy --workspace --exclude folyvo-desktop --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: detect
        shell: bash
        run: |
          if [ -f Cargo.toml ]; then echo "rust=true" >> "$GITHUB_OUTPUT"; else echo "rust=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.detect.outputs.rust == 'true'
        uses: ./.github/actions/setup-rust
      - if: steps.detect.outputs.rust == 'true'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-nextest
      - if: steps.detect.outputs.rust == 'true'
        run: cargo nextest run --workspace --exclude folyvo-desktop --profile ci
      - if: steps.detect.outputs.rust == 'true'
        run: cargo test --workspace --exclude folyvo-desktop --doc

  deny:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: detect
        run: |
          if [ -f Cargo.toml ]; then echo "rust=true" >> "$GITHUB_OUTPUT"; else echo "rust=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.detect.outputs.rust == 'true'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-deny
      - if: steps.detect.outputs.rust == 'true'
        run: cargo deny check

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-gitleaks
      - name: Scan the commits in this change
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="origin/${BASE_REF}..HEAD"
          else
            range="-1"
          fi
          ./gitleaks git --config .gitleaks.toml --redact --verbose --log-opts="$range"

  workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-actionlint
      - run: ./actionlint
      - run: scripts/check-pins.sh

  scripts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Lint the shell scripts
        run: shellcheck scripts/*.sh scripts/tests/*.sh
      - name: Run the script tests
        run: |
          for t in scripts/tests/*.test.sh; do
            echo "== $t"
            bash "$t"
          done

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check relative links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --offline --no-progress './**/*.md'
          fail: true

  desktop:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json
      - name: Check, test and build the UI
        run: |
          npm --prefix apps/desktop/ui ci
          npm --prefix apps/desktop/ui run typecheck
          npm --prefix apps/desktop/ui test
          npm --prefix apps/desktop/ui run build
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - name: Test and lint the desktop crate
        run: |
          cargo test -p folyvo-desktop
          cargo clippy -p folyvo-desktop --all-targets -- -D warnings
      - name: Fail when the generated TypeScript types drifted
        run: |
          git diff --exit-code -- apps/desktop/ui/src/generated
          test -z "$(git status --porcelain -- apps/desktop/ui/src/generated)"

  ci-success:
    if: always()
    needs: [commits, fmt, clippy, test, deny, secrets, workflows, scripts, docs, desktop]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - name: Decide
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: scripts/ci-gate.sh
