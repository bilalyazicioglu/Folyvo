name: Desktop bundle

# Builds an unsigned Folyvo.app on demand so contributors can try the app without a toolchain.
on:
  workflow_dispatch:

permissions: {}

jobs:
  bundle:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json
      - run: npm --prefix apps/desktop/ui ci
      - run: cargo install tauri-cli --version "^2.12" --locked
      - name: Build the app
        run: cd apps/desktop/src-tauri && cargo tauri build
      - name: Zip the app
        run: cd target/release/bundle/macos && ditto -c -k --keepParent Folyvo.app "$GITHUB_WORKSPACE/Folyvo-unsigned.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Folyvo-unsigned
          path: Folyvo-unsigned.zip
          retention-days: 7
