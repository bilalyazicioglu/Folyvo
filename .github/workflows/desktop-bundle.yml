name: Desktop bundle

# Builds an unsigned Folyvo.app on demand so contributors can try the app without a toolchain.
on:
  workflow_dispatch:

permissions: {}

jobs:
  bundle:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json
      - run: npm --prefix apps/desktop/ui ci
      - run: cargo install tauri-cli --version "^2.12" --locked
      - name: Build the app
        run: cd apps/desktop/src-tauri && cargo tauri build
      - name: Zip the app
        run: cd target/release/bundle/macos && ditto -c -k --keepParent Folyvo.app "$GITHUB_WORKSPACE/Folyvo-unsigned.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Folyvo-unsigned
          path: Folyvo-unsigned.zip
          retention-days: 7
