name: Bug report
description: Something does not work as it should
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem in a few sentences.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, in order?
      placeholder: |
        1. Add a folder
        2. Save a file
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Folyvo version
      description: Shown in the app, or the commit you built from.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: macOS version
      placeholder: "for example 15.2"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Optional. Please remove anything private first.
      render: shell
