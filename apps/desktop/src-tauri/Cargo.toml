[package]
name = "folyvo-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "folyvo_desktop"

[[bin]]
name = "folyvo-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
folyvo-core = { path = "../../../crates/folyvo-core", version = "0.1.0" }
folyvo-compare = { path = "../../../crates/folyvo-compare", version = "0.1.0" }
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-positioner = { version = "2.4", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"
base64 = "0.22"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.8"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSSharingService", "NSResponder", "NSView", "NSApplication", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSArray", "NSError", "NSGeometry"] }

[dev-dependencies]
tempfile = "3"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
